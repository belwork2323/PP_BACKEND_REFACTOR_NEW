# ============================================================
# ACEM-client - test profile
# ============================================================

application.name=acempp
application.version=1.1
application.artifact=acempp


# ============================================================
# Application
# ============================================================
#spring.application.name=${SPRING_APPLICATION_NAME:acempp}
server.port=${SERVER_PORT:8080}

# ============================================================
# MongoDB
# ============================================================
spring.data.mongodb.host=${SPRING_DATA_MONGODB_HOST:mongodb}
spring.data.mongodb.port=${SPRING_DATA_MONGODB_PORT:27017}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:ppdb}

spring.data.mongodb.username=${SPRING_DATA_MONGODB_USERNAME}
spring.data.mongodb.password=${SPRING_DATA_MONGODB_PASSWORD}
spring.data.mongodb.authentication-database=${SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE:admin}

# ============================================================
# JWT
# ============================================================
jwt.secret=${JWT_SECRET}

jwt.access_token_expiration=${JWT_ACCESS_TOKEN_EXPIRATION:86400000}
jwt.refresh_token_expiration=${JWT_REFRESH_TOKEN_EXPIRATION:86400000}
jwt.inactivity_threshold=${JWT_INACTIVITY_THRESHOLD:86400000}

# ============================================================
# File uploads
# ============================================================
file.upload-dir=${FILE_UPLOAD_DIR:/app/uploads}

# ============================================================
# Multipart
# ============================================================
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:50MB}


# ============================================================
# Hyperledger Explorer
# ============================================================
blockchain.explorer.url=${BLOCKCHAIN_EXPLORER_URL}
blockchain.explorer.username=${BLOCKCHAIN_EXPLORER_USERNAME}
blockchain.explorer.password=${BLOCKCHAIN_EXPLORER_PASSWORD}
blockchain.explorer.network=${BLOCKCHAIN_EXPLORER_NETWORK}

# ============================================================
# Hyperledger Gateway App
# ============================================================
blockchain.asset.url=${BLOCKCHAIN_GATEWAY_URL:http://172.16.69.88:8080}
blockchain.asset.peer-srt=${BLOCKCHAIN_GATEWAY_PEER_SRT:1b26823394f7806b80d246f043caa8c91d98092f3f7c26abfd55d193cce65120}
blockchain.asset.userid=${BLOCKCHAIN_GATEWAY_USERID:admin}
blockchain.asset.schema-id=${BLOCKCHAIN_GATEWAY_SCHEMA_ID:uid:acem:schema/process-schema}
blockchain.asset.crn.id=${BLOCKCHAIN_GATEWAY_ASSET_ID:uid:acem:asset/}

# ============================================================
# Enable Blockchain?
# true = call blockchain gateway
# false = skip blockchain CREATE on approval (dev/refine)
# ============================================================
blockchain.asset.create.enabled=${BLOCKCHAIN_ASSET_CREATE_ENABLED:true}

# how long the app waits to establish a connection
rest.client.connect-timeout=${REST_CLIENT_CONNECT_TIMEOUT:30000}

# how long the app waits for a response/data after connecting
rest.client.read-timeout=${REST_CLIENT_READ_TIMEOUT:60000}
